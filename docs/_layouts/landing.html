<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ page.title | default: site.title }} — Distributed AI & Federated Systems</title>
  <link rel="icon" href="{{ site.logo | default: '/assets/images/fedpilot_logo.jpeg' | relative_url }}" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/landing.css' | relative_url }}">
</head>
<body class="landing-page">
  <div class="landing-bg" aria-hidden="true">
    <div class="grid-overlay"></div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
  </div>

  <header class="landing-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img
        class="brand-logo"
        src="{{ site.logo | default: '/assets/images/fedpilot_logo.jpeg' | relative_url }}"
        alt="FedPilot logo"
        width="36"
        height="36"
      />
      <span class="brand-text">FedPilot</span>
    </a>
    <button
      type="button"
      class="nav-toggle"
      aria-controls="site-nav"
      aria-expanded="false"
      aria-label="Open menu"
    >
      <span class="nav-toggle-bar" aria-hidden="true"></span>
      <span class="nav-toggle-bar" aria-hidden="true"></span>
      <span class="nav-toggle-bar" aria-hidden="true"></span>
    </button>
    <nav id="site-nav" class="landing-nav" aria-label="Primary">
      <a class="nav-link" href="{{ '/blog/' | relative_url }}">Blog</a>
      <a class="nav-link" href="{{ '/docs/' | relative_url }}" target="_blank" rel="noopener noreferrer">Documentation</a>
      <a class="nav-link nav-link-cta" href="{{ '/contact/' | relative_url }}">Contact</a>
    </nav>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="landing-footer">
    <p>FedPilot — topology-aware federated learning on Ray</p>
    <nav aria-label="Footer">
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
      <a href="{{ '/docs/' | relative_url }}" target="_blank" rel="noopener noreferrer">Documentation</a>
      <a href="{{ '/contact/' | relative_url }}">Contact</a>
      <a href="https://github.com/fedpilot" target="_blank" rel="noopener noreferrer">GitHub</a>
    </nav>
    <p class="landing-copyright">
      <span class="copyright-symbol" aria-hidden="true">©</span>
      {{ site.time | date: '%Y' }} All rights reserved.
      <a href="https://fedpilot.ir" target="_blank" rel="noopener noreferrer">FedPilot.ir</a> team
    </p>
  </footer>

  <script src="{{ '/assets/js/nav.js' | relative_url }}" defer></script>
  {% if page.load_team %}
  <script src="{{ '/assets/js/team.js' | relative_url }}" defer></script>
  {% endif %}
</body>
</html>
